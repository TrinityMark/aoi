<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Alignment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        }
        .accordion-button {
            background: #15397F;
        }
        .accordion-button:hover {
            background: #0f2f69;
        }
        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease-out;
        }
        .accordion-content.active {
            max-height: none;
            overflow: visible;
        }
        textarea, input[type="text"] {
            font-size: 0.95rem;
        }
        .mic-btn {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: #15397F;
            color: white;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.2s, background 0.2s;
        }
        .mic-btn:hover { opacity: 1; }
        .mic-btn.recording {
            background: #dc2626;
            opacity: 1;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(220,38,38,0.4); }
            50% { box-shadow: 0 0 0 6px rgba(220,38,38,0); }
        }
        .field-wrap { position: relative; }
        .field-wrap textarea, .field-wrap input[type="text"] { padding-right: 44px; }
    </style>
</head>
<body class="bg-gray-50">
    <div class="min-h-screen">
        <header class="bg-[#15397F] text-white shadow-lg">
            <div class="max-w-full px-6 py-8">
                <h1 class="text-4xl font-bold">Business Alignment</h1>
                <p class="text-blue-100 mt-2">Area of Innovation (AOI), Unique Selling Proposition (USP) and Tagline</p>
            </div>
        </header>

        <main class="max-w-full px-6 py-8">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <div class="lg:col-span-2 space-y-4">

                    <!-- AOI Section -->
                    <div class="bg-white rounded-lg shadow">
                        <button class="accordion-button w-full px-6 py-4 text-white font-semibold text-lg flex justify-between items-center rounded-t-lg" onclick="toggleAccordion(0)">
                            <span>Area of Innovation (AOI)</span>
                            <svg class="w-5 h-5" id="icon-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="transform: rotate(180deg);">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>
                            </svg>
                        </button>
                        <div class="accordion-content active" id="content-0">
                            <div class="px-6 py-4 space-y-6 bg-gray-50">
                                <div>
                                    <label class="block text-base font-semibold text-gray-700 mb-2">Choose your Industry</label>
                                    <div class="field-wrap">
                                        <input id="industry" type="text" oninput="saveToStorage()" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#15397F]" placeholder="Eg. Diesel Mechanic, Cabinet Maker, Plumber, Commercial Builder">
                                        <button class="mic-btn" onclick="startVoice('industry', this)" title="Speak">
                                            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/></svg>
                                        </button>
                                    </div>
                                </div>
                                <div>
                                    <h3 class="font-semibold text-gray-900 mb-2">Choose your AOI Category:</h3>
                                    <div class="space-y-2">
                                        <label class="flex items-center">
                                            <input type="radio" name="aoi-category" value="price" class="w-4 h-4" onchange="saveToStorage()">
                                            <span class="ml-2">Price (the highest or the lowest)</span>
                                        </label>
                                        <label class="flex items-center">
                                            <input type="radio" name="aoi-category" value="convenience" class="w-4 h-4" onchange="saveToStorage()">
                                            <span class="ml-2">Convenience (built in or value added i.e. mobile service, faster turnaround)</span>
                                        </label>
                                        <label class="flex items-center">
                                            <input type="radio" name="aoi-category" value="quality" class="w-4 h-4" onchange="saveToStorage()">
                                            <span class="ml-2">Quality (Product/service superiority, unique features, customer service, expertise & workmanship, customisation)</span>
                                        </label>
                                    </div>
                                </div>

                                <div>
                                    <h3 class="font-semibold text-gray-900 mb-3">Answer the Following Questions:</h3>
                                    <div class="space-y-4">
                                        <div>
                                            <label class="block text-sm font-medium text-gray-700 mb-1">1. What area is currently not being well addressed by your industry?</label>
                                            <div class="field-wrap">
                                                <textarea id="question-1" oninput="saveToStorage()" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#15397F]" rows="3"></textarea>
                                                <button class="mic-btn" onclick="startVoice('question-1', this)" title="Speak">
                                                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/></svg>
                                                </button>
                                            </div>
                                            <button id="generate-ideas-button" onclick="generateAIideas()" class="mt-3 px-4 py-2 bg-[#15397F] text-white rounded hover:bg-[#0f2f69] transition">Generate some ideas</button>
                                            <div id="ai-ideas-panel" class="mt-4 p-4 bg-white border border-gray-200 rounded-lg hidden">
                                                <p id="ai-ideas-error" class="text-red-600 text-sm mb-3 hidden"></p>
                                                <div class="space-y-3" id="ai-ideas-list"></div>
                                            </div>
                                        </div>
                                        <div>
                                            <label class="block text-sm font-medium text-gray-700 mb-1">2. What are the strengths and abilities of your company?</label>
                                            <div class="field-wrap">
                                                <textarea id="question-2" oninput="saveToStorage()" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#15397F]" rows="3"></textarea>
                                                <button class="mic-btn" onclick="startVoice('question-2', this)" title="Speak">
                                                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/></svg>
                                                </button>
                                            </div>
                                        </div>
                                        <div>
                                            <label class="block text-sm font-medium text-gray-700 mb-1">3. What does the market want most from your industry or business?</label>
                                            <div class="field-wrap">
                                                <textarea id="question-3" oninput="saveToStorage()" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#15397F]" rows="3"></textarea>
                                                <button class="mic-btn" onclick="startVoice('question-3', this)" title="Speak">
                                                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/></svg>
                                                </button>
                                            </div>
                                        </div>
                                        <div>
                                            <label class="block text-sm font-medium text-gray-700 mb-1">4. Describe your AOI</label>
                                            <div class="field-wrap">
                                                <textarea id="aoi-description" oninput="syncAOI(); saveToStorage();" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#15397F]" rows="3" placeholder="Type your Area of Innovation here..."></textarea>
                                                <button class="mic-btn" onclick="startVoice('aoi-description', this)" title="Speak">
                                                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/></svg>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- USP Section -->
                    <div class="bg-white rounded-lg shadow">
                        <button class="accordion-button w-full px-6 py-4 text-white font-semibold text-lg flex justify-between items-center rounded-t-lg" onclick="toggleAccordion(1)">
                            <span>Unique Selling Proposition (USP)</span>
                            <svg class="w-5 h-5" id="icon-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>
                            </svg>
                        </button>
                        <div class="accordion-content" id="content-1">
                            <div class="px-6 py-4 space-y-6 bg-gray-50">
                                <div class="space-y-4">
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 mb-1">1. Identify your target audience:</label>
                                        <div class="field-wrap">
                                            <textarea id="usp-1" oninput="saveToStorage()" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#15397F]" rows="3"></textarea>
                                            <button class="mic-btn" onclick="startVoice('usp-1', this)" title="Speak">
                                                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/></svg>
                                            </button>
                                        </div>
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 mb-1">2. List the benefits you offer:</label>
                                        <div class="field-wrap">
                                            <textarea id="usp-2" oninput="saveToStorage()" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#15397F]" rows="3"></textarea>
                                            <button class="mic-btn" onclick="startVoice('usp-2', this)" title="Speak">
                                                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/></svg>
                                            </button>
                                        </div>
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 mb-1">3. Define your brand promise:</label>
                                        <div class="field-wrap">
                                            <textarea id="usp-3" oninput="saveToStorage()" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#15397F]" rows="3"></textarea>
                                            <button class="mic-btn" onclick="startVoice('usp-3', this)" title="Speak">
                                                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/></svg>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                                <div class="bg-white p-4 rounded border border-gray-200">
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Your USP Statement:</label>
                                    <div class="field-wrap">
                                        <textarea id="usp-statement" oninput="saveToStorage()" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#15397F]" rows="4" placeholder="Your AI-generated USP will appear here..."></textarea>
                                        <button class="mic-btn" onclick="startVoice('usp-statement', this)" title="Speak">
                                            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/></svg>
                                        </button>
                                    </div>
                                    <button class="mt-3 px-4 py-2 bg-[#15397F] text-white rounded hover:bg-[#0f2f69] transition">Generate USP Statement</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Tagline Section -->
                    <div class="bg-white rounded-lg shadow">
                        <button class="accordion-button w-full px-6 py-4 text-white font-semibold text-lg flex justify-between items-center rounded-t-lg" onclick="toggleAccordion(2)">
                            <span>Tagline</span>
                            <svg class="w-5 h-5" id="icon-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>
                            </svg>
                        </button>
                        <div class="accordion-content" id="content-2">
                            <div class="px-6 py-4 space-y-6 bg-gray-50">
                                <div class="space-y-4">
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 mb-1">1. What's your core message?</label>
                                        <div class="field-wrap">
                                            <textarea id="tagline-1" oninput="saveToStorage()" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#15397F]" rows="3"></textarea>
                                            <button class="mic-btn" onclick="startVoice('tagline-1', this)" title="Speak">
                                                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/></svg>
                                            </button>
                                        </div>
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 mb-1">2. What emotion do you want to evoke?</label>
                                        <div class="field-wrap">
                                            <textarea id="tagline-2" oninput="saveToStorage()" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#15397F]" rows="3"></textarea>
                                            <button class="mic-btn" onclick="startVoice('tagline-2', this)" title="Speak">
                                                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/></svg>
                                            </button>
                                        </div>
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 mb-1">3. What makes you memorable?</label>
                                        <div class="field-wrap">
                                            <textarea id="tagline-3" oninput="saveToStorage()" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#15397F]" rows="3"></textarea>
                                            <button class="mic-btn" onclick="startVoice('tagline-3', this)" title="Speak">
                                                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/></svg>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                                <div class="bg-white p-4 rounded border border-gray-200">
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Your Tagline Options:</label>
                                    <div class="space-y-2 mb-4">
                                        <div class="field-wrap">
                                            <input id="tagline-opt-1" type="text" oninput="saveToStorage()" placeholder="Option 1" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#15397F]">
                                            <button class="mic-btn" onclick="startVoice('tagline-opt-1', this)" title="Speak">
                                                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/></svg>
                                            </button>
                                        </div>
                                        <div class="field-wrap">
                                            <input id="tagline-opt-2" type="text" oninput="saveToStorage()" placeholder="Option 2" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#15397F]">
                                            <button class="mic-btn" onclick="startVoice('tagline-opt-2', this)" title="Speak">
                                                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/></svg>
                                            </button>
                                        </div>
                                        <div class="field-wrap">
                                            <input id="tagline-opt-3" type="text" oninput="saveToStorage()" placeholder="Option 3" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#15397F]">
                                            <button class="mic-btn" onclick="startVoice('tagline-opt-3', this)" title="Speak">
                                                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/></svg>
                                            </button>
                                        </div>
                                    </div>
                                    <button class="px-4 py-2 bg-[#15397F] text-white rounded hover:bg-[#0f2f69] transition">Generate Tagline Options</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Right Panel: Summary -->
                <div class="lg:col-span-1">
                    <div class="bg-white rounded-lg shadow p-6 sticky top-8">
                        <h2 class="text-xl font-bold text-gray-900 mb-4">Your Positioning Summary</h2>
                        <div class="space-y-4">
                            <div>
                                <h3 class="font-semibold text-gray-700 text-sm">Area of Innovation</h3>
                                <p id="aoi-summary-text" class="text-gray-600 text-sm mt-1">(Not yet generated)</p>
                            </div>
                            <div class="border-t pt-4">
                                <h3 class="font-semibold text-gray-700 text-sm">Unique Selling Proposition</h3>
                                <p class="text-gray-600 text-sm mt-1">(Not yet generated)</p>
                            </div>
                            <div class="border-t pt-4">
                                <h3 class="font-semibold text-gray-700 text-sm">Tagline</h3>
                                <p class="text-gray-600 text-sm mt-1">(Not yet generated)</p>
                            </div>
                            <div class="border-t pt-4 space-y-2">
                                <button class="w-full px-4 py-2 bg-[#15397F] text-white rounded hover:bg-[#0f2f69] transition">Download PDF</button>
                                <button class="w-full px-4 py-2 border border-[#15397F] text-[#15397F] rounded hover:bg-blue-50 transition">Send via Email</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // ── localStorage ──────────────────────────────────────────────
        const TEXT_FIELDS = [
            'industry','question-1','question-2','question-3','aoi-description',
            'usp-1','usp-2','usp-3','usp-statement',
            'tagline-1','tagline-2','tagline-3','tagline-opt-1','tagline-opt-2','tagline-opt-3'
        ];

        function saveToStorage() {
            TEXT_FIELDS.forEach(id => {
                const el = document.getElementById(id);
                if (el) localStorage.setItem(id, el.value);
            });
            const radio = document.querySelector('input[name="aoi-category"]:checked');
            if (radio) localStorage.setItem('aoi-category', radio.value);
        }

        function restoreFromStorage() {
            TEXT_FIELDS.forEach(id => {
                const el = document.getElementById(id);
                const val = localStorage.getItem(id);
                if (el && val) el.value = val;
            });
            const savedCategory = localStorage.getItem('aoi-category');
            if (savedCategory) {
                const radio = document.querySelector(`input[name="aoi-category"][value="${savedCategory}"]`);
                if (radio) radio.checked = true;
            }
            syncAOI();
        }

        // ── Voice input ───────────────────────────────────────────────
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let activeRecognition = null;
        let activeMicBtn = null;

        function startVoice(fieldId, btnEl) {
            if (!SpeechRecognition) {
                alert('Voice input is not supported in this browser. Please use Chrome or Edge.');
                return;
            }
            if (activeRecognition) {
                activeRecognition.stop();
                return;
            }
            const recognition = new SpeechRecognition();
            recognition.lang = 'en-AU';
            recognition.continuous = false;
            recognition.interimResults = false;

            activeRecognition = recognition;
            activeMicBtn = btnEl;
            btnEl.classList.add('recording');

            recognition.onresult = (e) => {
                const transcript = e.results[0][0].transcript;
                const field = document.getElementById(fieldId);
                field.value = field.value ? field.value + ' ' + transcript : transcript;
                saveToStorage();
                if (fieldId === 'aoi-description') syncAOI();
            };

            recognition.onend = () => {
                activeRecognition = null;
                if (activeMicBtn) activeMicBtn.classList.remove('recording');
                activeMicBtn = null;
            };

            recognition.onerror = () => {
                activeRecognition = null;
                if (activeMicBtn) activeMicBtn.classList.remove('recording');
                activeMicBtn = null;
            };

            recognition.start();
        }

        // ── Accordion ─────────────────────────────────────────────────
        function toggleAccordion(index) {
            const content = document.getElementById(`content-${index}`);
            const icon = document.getElementById(`icon-${index}`);
            const isOpen = content.classList.contains('active');

            if (isOpen) {
                content.style.maxHeight = content.scrollHeight + 'px';
                content.style.overflow = 'hidden';
                requestAnimationFrame(() => {
                    content.style.transition = 'max-height 0.35s ease-out';
                    content.style.maxHeight = '0';
                });
                content.classList.remove('active');
                icon.style.transform = 'rotate(0deg)';
            } else {
                content.style.maxHeight = content.scrollHeight + 'px';
                content.style.overflow = 'hidden';
                content.style.transition = 'max-height 0.35s ease-in';
                content.classList.add('active');
                icon.style.transform = 'rotate(180deg)';
                content.addEventListener('transitionend', () => {
                    content.style.maxHeight = 'none';
                    content.style.overflow = 'visible';
                    content.style.transition = '';
                }, { once: true });
            }
        }

        // ── AOI summary sync ──────────────────────────────────────────
        function syncAOI() {
            const value = document.getElementById('aoi-description').value.trim();
            document.getElementById('aoi-summary-text').textContent = value || '(Not yet generated)';
        }

        // ── AI ideas ──────────────────────────────────────────────────
        const FLOW_URL = 'https://bb06665214b0e7c9957df91fc7a08e.c0.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/5cdce877a561402c94b03243239610d8/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=TqtOAzyz7PUQIcLl3Ry6gqh9Z56B4ujkGIDnmr63P2E';

        async function generateAIideas() {
            const button = document.getElementById('generate-ideas-button');
            const panel = document.getElementById('ai-ideas-panel');
            const list = document.getElementById('ai-ideas-list');
            const errorText = document.getElementById('ai-ideas-error');
            const area_not_addressed = document.getElementById('question-1').value.trim();
            const client_industry = document.getElementById('industry').value.trim();
            const aoi_category = document.querySelector('input[name="aoi-category"]:checked')?.value || '';

            button.disabled = true;
            button.textContent = 'Generating...';
            errorText.classList.add('hidden');
            list.innerHTML = '<div class="text-gray-600">Generating ideas…</div>';
            panel.classList.remove('hidden');

            try {
                const response = await fetch(FLOW_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ area_not_addressed, client_industry, aoi_category })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Request failed');

                list.innerHTML = '';
                data.ideas.forEach((idea, index) => {
                    const trimmed = idea.trim();
                    if (!trimmed) return;
                    const wrapper = document.createElement('div');
                    wrapper.className = 'flex items-start space-x-2';

                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.id = `idea-${index}`;
                    checkbox.className = 'mt-1 h-4 w-4 text-[#15397F] border-gray-300 rounded flex-shrink-0';

                    const label = document.createElement('label');
                    label.htmlFor = checkbox.id;
                    label.className = 'text-gray-700';
                    label.innerHTML = trimmed.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

                    wrapper.appendChild(checkbox);
                    wrapper.appendChild(label);
                    list.appendChild(wrapper);
                });
            } catch (error) {
                errorText.textContent = error.message;
                errorText.classList.remove('hidden');
                list.innerHTML = '';
            } finally {
                button.disabled = false;
                button.textContent = 'Generate some ideas';
            }
        }

        // ── Init ──────────────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', restoreFromStorage);
    </script>
</body>
